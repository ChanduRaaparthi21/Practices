server:
  port: 8080

spring:
  application:
    name: api-gateway


  cloud:
    gateway:
      routes:

        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/users/**
          filters:
            - AuthenticationFilter    # 🔥 Add this

        - id: product-service
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/products/**
          filters:
            - AuthenticationFilter    # 🔥 Add this

        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/auth/**           # public — no filter here
