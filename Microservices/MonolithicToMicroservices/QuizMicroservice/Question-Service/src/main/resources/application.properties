spring.application.name=question-service

spring.datasource.url=jdbc:mysql://localhost:3306/quizz_db
spring.datasource.username=root
spring.datasource.password=chandu221299
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.datasource.hikari.maximum-pool-size=10

#kafka properties
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=question-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=com.chandu.common.events.QuizCreatedEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false


