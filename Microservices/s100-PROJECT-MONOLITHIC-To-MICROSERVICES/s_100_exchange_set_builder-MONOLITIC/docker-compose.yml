version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: s100-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    volumes:
      - ./data:/app/data
      - ./workspace:/app/workspace
    networks:
      - s100-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: s100-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - s100-network

networks:
  s100-network:
    driver: bridge

volumes:
  data:
  workspace:
