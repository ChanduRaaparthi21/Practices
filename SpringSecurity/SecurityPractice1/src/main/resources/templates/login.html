<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <style>
        body { font-family: Arial; background: #f2f2f2; }
        .login-box {
            width: 300px; padding: 20px; background: white;
            margin: 100px auto; border-radius: 8px; box-shadow: 0 0 10px gray;
        }
        input { width: 100%; padding: 8px; margin-top: 10px; }
        button { width: 100%; padding: 8px; margin-top: 15px; }
        .error { color: red; }
        .msg { color: green; }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Login</h2>

    <!-- show error message -->
    <div th:if="${param.error}" class="error">
        Invalid username or password!
    </div>

    <!-- show logout message -->
    <div th:if="${param.logout}" class="msg">
        You have been logged out successfully.
    </div>

    <form th:action="@{/doLogin}" method="post">

        <input type="text" name="username" placeholder="Username" required />

        <input type="password" name="password" placeholder="Password" required />

        <button type="submit">Login</button>
    </form>
</div>

</body>
</html>
