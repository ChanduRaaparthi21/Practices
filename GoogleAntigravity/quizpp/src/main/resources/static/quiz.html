<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizApp - Attempt Quiz</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
</head>

<body>
    <nav class="navbar">
        <div class="container navbar-content">
            <a href="/user.html" class="logo">⚡ QuizApp</a>
        </div>
    </nav>

    <div class="container" style="max-width: 800px;">
        <div id="quizContainer" class="fade-in">
            <div class="card">
                <h2>Loading Quiz...</h2>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        checkAuth();

        const urlParams = new URLSearchParams(window.location.search);
        const quizId = urlParams.get('id');

        if (!quizId) {
            alert('No quiz specified');
            window.location.href = '/user.html';
        }

        let currentQuiz = null;

        async function loadQuiz() {
            try {
                currentQuiz = await api.getQuiz(quizId);
                renderQuiz();
            } catch (err) {
                showError('Failed to load quiz');
            }
        }

        function renderQuiz() {
            const container = document.getElementById('quizContainer');

            let html = `
                <div class="quiz-header">
                    <h1>${currentQuiz.title}</h1>
                    <p class="text-light">Answer all questions below</p>
                </div>
                <form id="quizForm">
            `;

            currentQuiz.questions.forEach((q, index) => {
                html += `
                    <div class="card question-card">
                        <h3>${index + 1}. ${q.title}</h3>
                        <div class="options-grid">
                            <label class="option-label">
                                <input type="radio" name="q_${q.id}" value="${q.option1}" class="option-input" required>
                                <span>${q.option1}</span>
                            </label>
                            <label class="option-label">
                                <input type="radio" name="q_${q.id}" value="${q.option2}" class="option-input">
                                <span>${q.option2}</span>
                            </label>
                            <label class="option-label">
                                <input type="radio" name="q_${q.id}" value="${q.option3}" class="option-input">
                                <span>${q.option3}</span>
                            </label>
                            <label class="option-label">
                                <input type="radio" name="q_${q.id}" value="${q.option4}" class="option-input">
                                <span>${q.option4}</span>
                            </label>
                        </div>
                    </div>
                `;
            });

            html += `
                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Submit Quiz</button>
                </form>
            `;

            container.innerHTML = html;

            document.getElementById('quizForm').addEventListener('submit', submitQuiz);
        }

        async function submitQuiz(e) {
            e.preventDefault();

            const answers = [];
            currentQuiz.questions.forEach(q => {
                const selected = document.querySelector(`input[name="q_${q.id}"]:checked`);
                if (selected) {
                    answers.push({
                        questionId: q.id,
                        chosenAnswer: selected.value
                    });
                }
            });

            try {
                const result = await api.submitQuiz(quizId, answers);
                alert(`Quiz Submitted! You scored ${result.score} points.`);
                window.location.href = '/user.html';
            } catch (err) {
                showError('Failed to submit quiz');
            }
        }

        loadQuiz();
    </script>
</body>

</html>
