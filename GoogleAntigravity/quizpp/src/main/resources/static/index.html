<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizApp - Login</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container auth-container">
        <div class="card fade-in">
            <div class="auth-header">
                <div class="logo" style="justify-content: center; margin-bottom: 1rem;">
                    <span>⚡ QuizApp</span>
                </div>
                <h1 id="formTitle">Welcome Back</h1>
                <p class="text-light">Enter your credentials to access your account</p>
            </div>

            <form id="authForm">
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" id="username" class="form-control" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="password" class="form-control" required>
                </div>

                <div class="form-group" id="roleGroup" style="display: none;">
                    <label class="form-label">Role</label>
                    <select id="role" class="form-control">
                        <option value="USER">User</option>
                        <option value="ADMIN">Admin</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%">Sign In</button>
            </form>

            <div style="text-align: center; margin-top: 1.5rem;">
                <p id="toggleText">Don't have an account? <a href="#" id="toggleAuth" style="color: var(--primary-color); text-decoration: none; font-weight: 600;">Sign Up</a></p>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        const form = document.getElementById('authForm');
        const toggleBtn = document.getElementById('toggleAuth');
        const roleGroup = document.getElementById('roleGroup');
        const formTitle = document.getElementById('formTitle');
        const toggleText = document.getElementById('toggleText');
        
        let isLogin = true;

        // Check if already logged in
        if (isAuthenticated()) {
            // Decode token to find role (simple check)
            const token = getToken();
            const payload = JSON.parse(atob(token.split('.')[1]));
            if (payload.role === 'ROLE_ADMIN') navigateTo('/admin.html');
            else navigateTo('/user.html');
        }

        toggleBtn.addEventListener('click', (e) => {
            e.preventDefault();
            isLogin = !isLogin;
            
            if (isLogin) {
                formTitle.textContent = 'Welcome Back';
                roleGroup.style.display = 'none';
                form.querySelector('button').textContent = 'Sign In';
                toggleText.innerHTML = 'Don\'t have an account? <a href="#" id="toggleAuth" style="color: var(--primary-color); text-decoration: none; font-weight: 600;">Sign Up</a>';
            } else {
                formTitle.textContent = 'Create Account';
                roleGroup.style.display = 'block';
                form.querySelector('button').textContent = 'Sign Up';
                toggleText.innerHTML = 'Already have an account? <a href="#" id="toggleAuth" style="color: var(--primary-color); text-decoration: none; font-weight: 600;">Sign In</a>';
            }
            
            // Re-attach listener since innerHTML replaced the element
            document.getElementById('toggleAuth').addEventListener('click', arguments.callee);
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            try {
                if (isLogin) {
                    const data = await api.login(username, password);
                    setToken(data.token);
                    
                    // Redirect based on role
                    const payload = JSON.parse(atob(data.token.split('.')[1]));
                    if (payload.role === 'ROLE_ADMIN') navigateTo('/admin.html');
                    else navigateTo('/user.html');
                } else {
                    const role = document.getElementById('role').value;
                    await api.register(username, password, role);
                    alert('Registration successful! Please login.');
                    location.reload();
                }
            } catch (err) {
                showError(err.message || 'Authentication failed');
            }
        });
    </script>
</body>
</html>
